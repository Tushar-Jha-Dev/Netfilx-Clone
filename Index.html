<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">

        <nav>
            <span><img src="Images/logo.svg" alt="Netflix Logo"></span>
            
            <div class="nav-right">
                
                <select class="lang" name="lang" id="lang">
                    <option value="English">English</option>
                    <option value="Hindi">Hindi</option>
                </select>
                
                <button class="btn">Sign In</button>
            
            </div>
        
        </nav>
        
        <div class="box"></div>
        
        <div class="content-body">
            
            <div class="content">
                
                <span class="first">All the hits you keep hearing about</span>
                <span class="second">Starts at ₹149. Cancel at any time.</span>
                <span class="third">Ready to watch? Enter your email to create or restart your membership.</span>
            
            </div>
            
            <div class="start">
                
                <input type="email" placeholder="Email address">
                <button class="btn2">Get Started</button>
            
            </div>
        
        </div>
        
        <div class="seperation"></div>

        <div class="section1">
            <h2>Trending Now</h2>
            <div class="card-container">
                <div class="cards">
                    <span class="rank">1</span>
                    <div class="card"></div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
